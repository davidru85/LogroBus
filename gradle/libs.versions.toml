# The only place where versions are declared (AGENTS.md §4).
# Compatibility set chosen 2026-10-22 (LB-001):
# - Kotlin 2.4.20: supported by SKIE 0.10.15 (ADR-0004); KGP 2.4.20 is fully
#   supported with Gradle 7.6.3 to 9.7.0 and AGP 8.5.2 to 9.3.1.
# - AGP 9.3.x (minimum Gradle 9.5.0, maximum API level 37).
# - Gradle 9.7.1 (wrapper).

[versions]
kotlin = "2.4.20"
agp = "9.3.3"
junit = "6.1.3"
konsist = "0.18.1"
android-compileSdk = "37"
android-targetSdk = "37"
android-minSdk = "26"
jvm-toolchain = "21"
android-jvmTarget = "17"
compose-bom = "2026.09.00"
androidx-activity = "1.13.0"
androidx-lifecycle = "2.11.0"
play-services-location = "21.4.0"
androidx-test-ext-junit = "1.3.0"
androidx-test-espresso = "3.7.0"
junit4 = "4.13.2"
robolectric = "4.17"
ktlint = "1.8.0"
# Alpha on purpose: the only detekt line built against Kotlin 2.4 and AGP 9.3 (ADR-0011).
detekt = "2.0.0-alpha.6"
kover = "0.9.11"
kotlinx-coroutines = "1.11.0"
turbine = "1.2.1"
# Ktor and kotlinx.serialization move as a set with Kotlin (ADR-0012).
ktor = "3.6.0"
kotlinx-serialization = "1.12.0"
sqldelight = "2.4.1"
# Koin assembles the graph in :shared:umbrella (ADR-0014).
koin = "4.2.2"
# Swift interop for :shared:umbrella (ADR-0004). It must support the Kotlin version above: 0.10.15 supports 2.4.20
# (see the compatibility set at the top). Bump the two together.
skie = "0.10.15"
# Not project dependencies: security floors for libraries that AGP 9.3 brings into its tools and plugin
# classpath with critical advisories (docs/ci_cd.md §6). Drop each once AGP brings a fixed version itself.
netty = "4.1.139.Final"
bouncycastle = "1.85"
freemarker = "2.3.35"

[libraries]
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
detekt-gradlePlugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
kover-gradlePlugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidx-lifecycle" }
# Google Play services licence, approved by the owner on 2026-10-26 (architecture.md §5.1).
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "play-services-location" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-test-espresso" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
ktlint-cli = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlint" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-encoding = { module = "io.ktor:ktor-client-encoding", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
bouncycastle-bom = { module = "org.bouncycastle:bc-jdk18on-bom", version.ref = "bouncycastle" }
freemarker = { module = "org.freemarker:freemarker", version.ref = "freemarker" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
skie = { id = "co.touchlab.skie", version.ref = "skie" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
