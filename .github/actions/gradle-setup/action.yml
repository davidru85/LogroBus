name: Gradle setup
description: JDK and Gradle with the build cache, shared by every Kotlin job (docs/ci_cd.md §5).

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        # Matches jvm-toolchain in gradle/libs.versions.toml.
        java-version: "21"
    # Third-party action, pinned by commit SHA (docs/ci_cd.md §6). It also validates the wrapper.
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        # The MIT-licensed cache. The default "enhanced" provider is proprietary and needs
        # the Gradle Technologies Terms of Use, which the owner has not accepted (docs/ci_cd.md §5).
        cache-provider: basic
