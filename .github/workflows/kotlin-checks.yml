# Kotlin checks: one atomic job per concern, each running a single Gradle
# task (docs/ci_cd.md §2–4).
#
# Owner rule: CI runs only while the repository is public (docs/ci_cd.md §1).
# The jobs run only when a change touches Kotlin or Gradle paths
# (scripts/ci/changed-areas.sh). The always-running "Kotlin gate" job is the
# required status check, so docs-only pull requests are not blocked.
name: Kotlin checks

on:
  pull_request:
    branches: [main]
  # Runs on main too, to verify the merge and to write the Gradle cache that
  # pull requests read.
  push:
    branches: [main]

permissions:
  contents: read

# One group per pull request, so a new push cancels the stale run. One group per
# commit on main, so back-to-back merges are each verified rather than cancelled.
concurrency:
  group: kotlin-checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Kotlin changes
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      kotlin: ${{ steps.areas.outputs.kotlin }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect the changed areas
        id: areas
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/ci/changed-areas.sh ${BASE_REF:+"origin/$BASE_REF"} >> "$GITHUB_OUTPUT"

  build-logic:
    name: Build-logic tests
    needs: changes
    if: ${{ needs.changes.outputs.kotlin == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/gradle-setup
      - name: Module rules and convention helpers
        run: ./gradlew :build-logic:convention:test

  ktlint:
    name: ktlint
    needs: changes
    if: ${{ needs.changes.outputs.kotlin == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/gradle-setup
      - name: Kotlin style (ktlint_official)
        run: ./gradlew ktlintCheck

  detekt:
    name: detekt
    needs: changes
    if: ${{ needs.changes.outputs.kotlin == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/gradle-setup
      - name: Static analysis with type resolution
        run: ./gradlew ciDetekt

  coverage:
    name: Coverage
    needs: changes
    if: ${{ needs.changes.outputs.kotlin == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/gradle-setup
      - name: Line coverage of shared domain, data and feature code (NFR-MNT-01)
        run: ./gradlew koverVerify

  architecture:
    name: Architecture rules
    needs: changes
    if: ${{ needs.changes.outputs.kotlin == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/gradle-setup
      - name: Module layout and package boundaries
        run: ./gradlew :tools:architecture-tests:test

  shared-unit-tests:
    # GitHub appends the matrix value: "Shared unit tests (:shared:core:common)".
    name: Shared unit tests
    needs: changes
    if: ${{ needs.changes.outputs.kotlin == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # Must list exactly the shared modules in settings.gradle.kts
      # (lb002_kotlinWorkflowRunsUnitTestsForEverySharedModule).
      matrix:
        module:
          - ":shared:core:common"
          - ":shared:core:config"
          - ":shared:core:telemetry"
          - ":shared:core:network"
          - ":shared:core:database"
          - ":shared:core:location"
          - ":shared:core:polling"
          - ":shared:core:presentation"
          - ":shared:core:testing"
          - ":shared:transit:domain"
          - ":shared:transit:data"
          - ":shared:favourites:domain"
          - ":shared:favourites:data"
          - ":shared:feature:lines"
          - ":shared:feature:stops"
          - ":shared:feature:nearme"
          - ":shared:feature:planner"
          - ":shared:feature:settings"
          - ":shared:umbrella"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/gradle-setup
      - name: Unit tests
        env:
          MODULE: ${{ matrix.module }}
        run: ./gradlew "$MODULE:ciUnitTest"

  android-unit-tests:
    # GitHub appends the matrix value: "Android unit tests (:android:app)".
    name: Android unit tests
    needs: changes
    if: ${{ needs.changes.outputs.kotlin == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # Must list exactly the Android modules in settings.gradle.kts
      # (lb002_kotlinWorkflowRunsUnitTestsForEveryAndroidModule).
      matrix:
        module:
          - ":android:app"
          - ":android:core:designsystem"
          - ":android:core:map"
          - ":android:core:navigation"
          - ":android:feature:lines"
          - ":android:feature:stops"
          - ":android:feature:nearme"
          - ":android:feature:planner"
          - ":android:feature:settings"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/gradle-setup
      - name: Unit tests (Robolectric)
        env:
          MODULE: ${{ matrix.module }}
        run: ./gradlew "$MODULE:ciUnitTest"

  android-build:
    name: Android build
    needs: changes
    if: ${{ needs.changes.outputs.kotlin == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/gradle-setup
      - name: Debug APK
        run: ./gradlew :android:app:assembleDebug

  android-lint:
    name: Android lint
    needs: changes
    if: ${{ needs.changes.outputs.kotlin == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/gradle-setup
      # Every Android module: the app does not depend on the core and feature modules yet, so linting
      # the app alone would skip them.
      - name: Lint (debug, every Android module)
        run: ./gradlew lintDebug

  dependency-graph:
    name: Dependency graph
    needs: changes
    if: ${{ needs.changes.outputs.kotlin == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Submitting to GitHub's dependency graph needs write access. Only this job has it, and it runs
    # nothing from the pull request but the Gradle build. Pull requests from forks get a read-only
    # token, so this job fails for them (docs/ci_cd.md §6).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Matches jvm-toolchain in gradle/libs.versions.toml, as in .github/actions/gradle-setup.
          java-version: "21"
      # GitHub cannot read Gradle dependencies from the build files: this resolves every
      # configuration and submits the result for the commit. Pushes to main submit the base
      # that pull requests are compared against.
      - name: Submit the resolved Gradle dependencies
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The MIT-licensed cache, as in .github/actions/gradle-setup (docs/ci_cd.md §5).
          cache-provider: basic
          validate-wrappers: true
          dependency-graph: generate-and-submit

  dependency-review:
    name: Dependency review
    # Must wait for the submitted graph (lb002_dependencyReviewWaitsForTheGradleDependencyGraph).
    needs: [changes, dependency-graph]
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.kotlin == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Known critical vulnerabilities in added or changed dependencies (NFR-SEC-05)
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: critical
          # Build plugins and test libraries run on CI and developer machines too.
          fail-on-scopes: runtime, development, unknown
          # GitHub processes a submitted graph asynchronously; wait for it rather than compare without it.
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 180

  ci-gate:
    name: Kotlin gate
    needs: [changes, build-logic, ktlint, detekt, coverage, architecture, shared-unit-tests, android-unit-tests, android-build, android-lint, dependency-graph, dependency-review]
    if: ${{ always() && !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Every Kotlin job passed, or was skipped because no Kotlin path changed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A Kotlin job ended with '$result'."; exit 1 ;;
            esac
          done
          echo "Kotlin job results: $RESULTS"
