org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Maven Central answers 429 Too Many Requests when many CI jobs download at once with an empty cache. Gradle retries
# 408, 429 and 5xx, by default 3 times from 1 s; these give it about a minute of backoff (docs/ci_cd.md §5).
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=2000

kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
